# Rime schema
# vim: set sw=2 sts=2 et:
# encoding: utf-8
#
# 复制自 https://github.com/tumuyan/rime-melt，修改了拼写派生
# 感谢 @[Mirtle](https://github.com/mirtlecn) 贡献的极其好用的拼写派生
# 全拼和各个双拼有部分拼写规则不通用，请将 speller/algebra 指向对应方案的规则

schema:
  schema_id: melt_eng
  name: Easy English Nano
  version: "2023-10-17"
  author:
    - Patrick <ipatrickmac@gmail.com>
    - tumuyan <tumuyan@21cn.com>
  description: Easy English Nano，只包含少量常用词汇，方便中英文混合输入度方案调用。

switches:
  - name: ascii_mode
    reset: 0
    states: [ASCII-OFF, ASCII-ON]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - recognizer
    #關閉標點符號轉換（對應symbols.yaml）    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
    - punct_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  algebra:
    # 根据当前所用拼音方案选择 __include 的值
    # 如果要在补丁中（melt_eng.custom.yaml）修改 algebra 以适配双拼，请参考 [常见问题](https://github.com/iDvel/rime-ice/issues/133)
    __include: melt_eng_algebra:/algebra_rime_frost         # 全拼
    # __include: melt_eng_algebra:/algebra_double_pinyin  # 自然码双拼
    # __include: melt_eng_algebra:/algebra_flypy          # 小鹤双拼
    # __include: melt_eng_algebra:/algebra_mspy           # 微软双拼
    # __include: melt_eng_algebra:/algebra_sogou          # 搜狗双拼
    # __include: melt_eng_algebra:/algebra_abc            # 智能ABC双拼
    # __include: melt_eng_algebra:/algebra_ziguang        # 紫光双拼

translator:
  dictionary: melt_eng
  spelling_hints: 9

key_binder:
  import_preset: default

punctuator:
  import_preset: default

recognizer:
  import_preset: default

# 兼容已有的外部引用；本方案及新补丁应直接引用独立规则文件。
algebra_common:
  __include: melt_eng_algebra_common:/algebra_common
algebra_rime_frost:
  __include: melt_eng_algebra:/algebra_rime_frost
algebra_double_pinyin:
  __include: melt_eng_algebra:/algebra_double_pinyin
algebra_flypy:
  __include: melt_eng_algebra:/algebra_flypy
algebra_mspy:
  __include: melt_eng_algebra:/algebra_mspy
algebra_sogou:
  __include: melt_eng_algebra:/algebra_sogou
algebra_abc:
  __include: melt_eng_algebra:/algebra_abc
algebra_ziguang:
  __include: melt_eng_algebra:/algebra_ziguang
