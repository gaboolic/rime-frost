# Rime schema settings
# encoding: utf-8

schema:
  schema_id: radical_pinyin
  name: "部件拆字 | 全拼双拼"
  version: "1.1.0"
  author: Mirtle
  description: |
    用拼音按顺序打出偏旁部件，组合出汉字
    码表：开放词典 / henrysting / Mirtle
    注音、校对、方案：Mirtle
    仓库：https://github.com/mirtlecn/rime_radical_pinyin

engine:
  processors:
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - echo_translator
    - table_translator
  filters:
    - uniquifier

key_binder:
  __include: default:/key_binder?

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  delimiter: " '"
  algebra:
    # 根据当前所用拼音方案选择 __include 的值
    __include: radical_pinyin_algebra:/algebra_pinyin           # 全拼
    # __include: radical_pinyin_algebra:/algebra_double_pinyin  # 自然码双拼
    # __include: radical_pinyin_algebra:/algebra_flypy          # 小鹤双拼
    # __include: radical_pinyin_algebra:/algebra_mspy           # 微软双拼
    # __include: radical_pinyin_algebra:/algebra_sogou          # 搜狗双拼
    # __include: radical_pinyin_algebra:/algebra_abc            # 智能ABC双拼
    # __include: radical_pinyin_algebra:/algebra_ziguang        # 紫光双拼

translator:
  dictionary: radical_pinyin
  enable_user_dict: false

# 兼容已有的外部引用；本方案及新补丁应直接引用独立规则文件。
algebra_pinyin:
  __include: radical_pinyin_algebra:/algebra_pinyin
algebra_double_pinyin:
  __include: radical_pinyin_algebra:/algebra_double_pinyin
algebra_flypy:
  __include: radical_pinyin_algebra:/algebra_flypy
algebra_mspy:
  __include: radical_pinyin_algebra:/algebra_mspy
algebra_sogou:
  __include: radical_pinyin_algebra:/algebra_sogou
algebra_abc:
  __include: radical_pinyin_algebra:/algebra_abc
algebra_ziguang:
  __include: radical_pinyin_algebra:/algebra_ziguang
