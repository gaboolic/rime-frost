# Rime schema settings
# encoding: utf-8

schema:
  schema_id: rime_frost_stroke_t9
  name: 九宫格笔画
  version: "1.0"
  description: |
    按笔顺输入单字：h 横（含提）、s 竖、p 撇、n 点/捺、z 折。
    支持前缀联想，不使用通配键。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

speller:
  alphabet: hspnz

menu:
  page_size: 9

translator:
  dictionary: stroke
  prism: rime_frost_stroke_t9
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  preedit_format:
    - xlit/hspnz/一丨丿丶乛/
  comment_format:
    - xform/^~//
    - xlit/hspnz/一丨丿丶乛/

punctuator:
  import_preset: default
